[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeplight"
version = "0.3.0"
dependencies = [
    "jax[cuda13]",
    "flax",
    "optax",
    "h5py",
    "tensorboardX",
    "matplotlib",
    "pandas",
    "seaborn",
    "tomli>=2.4.1",
    "nifty>=9.2.0",
    "cmasher>=1.9.2",
]
requires-python = ">=3.12"
authors = [
    {name = "Philipp Haim", email = "philipp.haim@helmholtz-munich.de"},
]
maintainers = [
    {name = "Philipp Haim", email = "philipp.haim@helmholtz-munich.de"},
]
description = "DNN for light absorption in tissue"
# readme = "README.md"
# license = {file = "LICENSE.txt"}
# keywords = ["NIFTy", "deeplight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python"
]

[project.urls]
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/me/spam.git"
